<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#fff;font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;color:#0F172A}
.frame{position:relative;width:100%;height:100%;padding:96px 96px 88px;display:flex;flex-direction:column}
.bar{position:absolute;left:0;top:0;width:24px;height:100%;background:#0B2545}
.top{display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:600;color:#1D4ED8;letter-spacing:.08em;text-transform:uppercase}
.num{color:#475569;letter-spacing:0}
.body{flex:1;display:flex;align-items:center}
.text{font-size:92px;line-height:1.18;font-weight:800;color:#0B2545;letter-spacing:-.01em}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.brand{font-size:34px;font-weight:800;color:#0B2545;letter-spacing:.02em}
.brand span{color:#1D4ED8}
.src{font-size:22px;color:#475569;max-width:640px;text-align:right}
</style></head><body><div class="frame"><div class="bar"></div>
<div class="top"><div></div><div class="num">1 / 6</div></div>
<div class="body"><div class="text">Anthropic Boosts AI Misuse Detection for Enterprises</div></div>
<div class="foot"><div class="brand">Abhedit<span>.</span></div></div>
</div></body></html>
