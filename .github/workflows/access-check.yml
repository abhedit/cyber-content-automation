name: Social Access Check

# Read-only: confirms each platform token still works and prints account names/IDs.
# Fails (GitHub emails you) when a token has expired, so posting never silently stops.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check tokens
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m content_engine check-access
