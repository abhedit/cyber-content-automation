name: Daily Cybersecurity Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Content File
        run: |
          mkdir -p output

          echo "# Abhedit Daily Content" > output/content.md
          echo "" >> output/content.md
          echo "Generated on $(date)" >> output/content.md
          echo "" >> output/content.md
          echo "This file was created automatically by GitHub Actions." >> output/content.md

      - name: Commit Content
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add output/content.md
          git commit -m "Auto-generate content file" || echo "No changes"

          git push
